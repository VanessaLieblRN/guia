document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

lay:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:12px\">\n      <sc-for list=\"{{ t.s5.after }}\" as=\"af\" hint-placeholder-count=\"7\">\n        <div style=\"background:#fff;border:1px solid #E2E5EE;border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:10px\">\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:#1F4FD1\">0{{ af.n }}<\u002Fspan>\n          <h4 style=\"margin:0;font-size:17px;font-weight:600;line-height:1.3;text-wrap:balance\">{{ af.t }}<\u002Fh4>\n          <p style=\"margin:0;font-size:15px;line-height:1.6;color:#535B73;text-wrap:pretty\">{{ af.d }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <p style=\"margin:8px 0 0;padding:24px 0 0;border-top:2px solid #0B2A7A;font-size:clamp(19px,2.2vw,24px);line-height:1.45;font-weight:500;color:#0B2A7A;max-width:900px;text-wrap:pretty\">{{ t.s5.summary }}<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"faq\" data-screen-label=\"06 FAQ\" style=\"background:#fff;border-top:1px solid #E2E5EE;border-bottom:1px solid #E2E5EE\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:96px 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:40px 64px;align-items:start\">\n    <div style=\"display:flex;flex-direction:column;gap:14px\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:#1F4FD1\">06<\u002Fspan>\n      <h2 style=\"margin:0;font-size:clamp(30px,4vw,44px);line-height:1.08;letter-spacing:-0.025em;font-weight:600\">{{ t.s6.title }}<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;border-top:1px solid #E2E5EE\">\n      <sc-for list=\"{{ faq }}\" as=\"f\" hint-placeholder-count=\"5\">\n        <div style=\"border-bottom:1px solid #E2E5EE\">\n          <button sc-camel-on-click=\"{{ f.toggle }}\" aria-expanded=\"{{ f.open }}\" style=\"width:100%;background:none;border:0;cursor:pointer;padding:22px 0;display:flex;justify-content:space-between;align-items:center;gap:20px;text-align:left;font-family:inherit;font-size:17px;font-weight:600;color:#141A2E;min-height:44px\">\n            <span style=\"text-wrap:pretty\">{{ f.q }}<\u002Fspan>\n            <span style=\"flex:none;width:28px;height:28px;border-radius:50%;background:#EEF0F5;color:#0B2A7A;display:grid;place-items:center;font-size:18px;line-height:1\">{{ f.sign }}<\u002Fspan>\n          <\u002Fbutton>\n          <sc-if value=\"{{ f.open }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"margin:0;padding:0 48px 24px 0;font-size:16px;line-height:1.65;color:#3A4259;text-wrap:pretty\">{{ f.a }}<\u002Fp>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"suite\" data-screen-label=\"07 Suite\" style=\"max-width:1200px;margin:0 auto;padding:96px 24px;display:flex;flex-direction:column;gap:40px\">\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:40px 64px\">\n    <div style=\"display:flex;flex-direction:column;gap:14px\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:#1F4FD1\">07<\u002Fspan>\n      <h2 style=\"margin:0;font-size:clamp(30px,4vw,44px);line-height:1.08;letter-spacing:-0.025em;font-weight:600\">{{ t.s7.title }}<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:16px\">\n      <h3 style=\"margin:0;font-size:20px;font-weight:600\">{{ t.s7.sub }}<\u002Fh3>\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:#535B73\">{{ t.s7.pathL }}<\u002Fspan>\n      <div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:center\">\n        <sc-for list=\"{{ path }}\" as=\"p\" hint-placeholder-count=\"4\">\n          <span style=\"display:flex;align-items:center;gap:8px\">\n            <span style=\"background:#0B2A7A;color:#fff;padding:8px 12px;border-radius:6px;font-size:14px;font-weight:500\">{{ p.label }}<\u002Fspan>\n            <sc-if value=\"{{ p.arrow }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"color:#1F4FD1;font-size:16px\">→<\u002Fspan><\u002Fsc-if>\n          <\u002Fspan>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:24px\">\n    <figure style=\"margin:0;display:flex;flex-direction:column;gap:12px\">\n      <div style=\"background:#fff;border:1px solid #E2E5EE;border-radius:14px;padding:10px;overflow:hidden\">\n        <img src=\"1a3917d6-080f-403d-890b-5e45e2e85396\" alt=\"{{ t.s7.cap1 }}\" style=\"display:block;width:100%;height:auto;border-radius:6px\">\n      <\u002Fdiv>\n      <figcaption style=\"display:flex;gap:12px;font-size:15px;line-height:1.5;color:#3A4259\"><span style=\"font-family:'IBM Plex Mono',monospace;color:#1F4FD1\">A<\u002Fspan><span>{{ t.s7.cap1 }}<\u002Fspan><\u002Ffigcaption>\n    <\u002Ffigure>\n    <figure style=\"margin:0;display:flex;flex-direction:column;gap:12px\">\n      <div style=\"background:#fff;border:1px solid #E2E5EE;border-radius:14px;padding:10px;overflow:hidden\">\n        <img src=\"6a2a74e2-8e51-42e9-b69d-603e8ac76539\" alt=\"{{ t.s7.cap2 }}\" style=\"display:block;width:100%;height:auto;border-radius:6px\">\n      <\u002Fdiv>\n      <figcaption style=\"display:flex;gap:12px;font-size:15px;line-height:1.5;color:#3A4259\"><span style=\"font-family:'IBM Plex Mono',monospace;color:#1F4FD1\">B<\u002Fspan><span>{{ t.s7.cap2 }}<\u002Fspan><\u002Ffigcaption>\n    <\u002Ffigure>\n    <p style=\"margin:0;background:#F1F4FC;border-radius:12px;padding:20px 24px;font-size:16px;line-height:1.55;color:#141A2E;text-wrap:pretty\">{{ t.s7.after }}<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fmain>\n\n<footer style=\"background:#0B2A7A;color:#AFC2F5\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:40px 24px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;font-size:14px\">\n    <span><strong style=\"color:#fff;font-weight:600\">SoftExpert<\u002Fstrong> · {{ t.footer }}<\u002Fspan>\n    <a href=\"#top\" style=\"color:#fff\">{{ t.toTop }} ↑<\u002Fa>\n  <\u002Fdiv>\n<\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;defaultLang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;pt&quot;,&quot;en&quot;,&quot;es&quot;],&quot;default&quot;:&quot;pt&quot;,&quot;tsType&quot;:&quot;'pt'|'en'|'es'&quot;},&quot;faqExpanded&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nconst LEVEL_EN = [\"Start\",\"Grow\",\"Solid\",\"Outstanding\",\"Role Model\"];\nconst SCORES = [20,40,60,80,100];\nconst T = {\npt: {\n  brandSub: \"Guia do Colaborador · AVD\",\n  nav: [{id:\"about\",label:\"O que é\"},{id:\"model\",label:\"Modelo\"},{id:\"levels\",label:\"Proficiência\"},{id:\"self\",label:\"Autoavaliação\"},{id:\"consensus\",label:\"Consenso\"},{id:\"faq\",label:\"Dúvidas\"},{id:\"suite\",label:\"Na Suite\"}],\n  heroEyebrow: \"Guia do Colaborador\",\n  heroTitle: \"Avaliação de Desempenho\",\n  heroLead: \"Tudo o que você precisa saber para participar do ciclo de AVD: como o modelo funciona, como se autoavaliar e o que fazer depois do consenso com o seu líder.\",\n  heroCta: \"Começar a leitura\",\n  heroCta2: \"Ir para a Suite\",\n  heroStats: [{n:\"8\",l:\"competências avaliadas\"},{n:\"3\",l:\"etapas no ciclo\"},{n:\"5\",l:\"níveis de proficiência\"}],\n  s1: {\n    title: \"O que é a Avaliação de Desempenho\",\n    p1: \"A Avaliação de Desempenho (AVD) é o momento estruturado em que você e o seu líder olham juntos para a sua entrega e para o seu comportamento no trabalho, usando os mesmos critérios para todas as pessoas do mesmo cargo.\",\n    p2: \"Se esta é a sua primeira vez participando de um ciclo de AVD, o ponto mais importante para entender antes de tudo é este:\",\n    quote: \"A AVD não é uma prova, nem uma punição.\",\n    p3: \"É uma ferramenta de desenvolvimento. Ela existe para reconhecer o que você já faz bem, alinhar expectativas com o seu líder sobre o que se espera do seu cargo e construir, juntos, os próximos passos da sua carreira na SoftExpert.\",\n    cards: [\n      {t:\"Mesmo critério para todos\",d:\"Cargos são avaliados pelo mesmo modelo de competências, então todo mundo é medido pela mesma régua.\"},\n      {t:\"Duas dimensões\",d:\"O que você entrega (competências de performance) e como você entrega (competências comportamentais).\"},\n      {t:\"Um ciclo, não um evento único\",d:\"Autoavaliação, consenso com o líder e acompanhamento depois — os três fazem parte do mesmo processo.\"}\n    ]\n  },\n  s2: {\n    title: \"Como o modelo funciona\",\n    p1: \"O principal objetivo é garantir que os profissionais estejam alinhados às expectativas do cargo e aos objetivos da organização, promovendo o desenvolvimento individual e a melhoria contínua dos resultados.\",\n    p2: \"Hoje utilizamos o modelo com o total de 8 competências — prática comum em frameworks de gestão de talentos — divididas em:\",\n    perfT: \"Performance\",\n    perfD: \"Competências técnicas e de entrega, específicas da sua disciplina: o “o quê” você produz no seu dia a dia.\",\n    behT: \"Comportamento\",\n    behD: \"Competências comportamentais: o “como” você entrega, se relaciona e colabora com o time.\",\n    stagesTitle: \"Etapas da avaliação\",\n    stages: [{n:\"1\",t:\"Autoavaliação\"},{n:\"2\",t:\"Avaliação do Líder\"},{n:\"3\",t:\"Consenso\"}],\n    ruleL: \"Regra\",\n    rule: \"A Avaliação de Desempenho é executada para colaboradores com mais de 3 meses de empresa.\"\n  },\n  s3: {\n    title: \"Níveis de proficiência\",\n    p: \"Níveis de proficiência são os graus que descrevem quão bem uma pessoa domina uma competência — do estágio inicial de aprendizado até o domínio completo, capaz de ser referência para outros. Em vez de uma nota numérica solta (subjetiva e variável entre avaliadores), o modelo descreve em texto como é o comportamento observável em cada estágio.\",\n    askL: \"Pergunta que ajuda a se posicionar\",\n    levels: [\n      {local:\"Início\",desc:\"Está nos primeiros estágios de desenvolvimento da competência. Compreende os fundamentos e executa atividades básicas com apoio e orientação frequentes.\",q:\"Eu ainda preciso de apoio constante para executar essa competência, mesmo em situações simples?\"},\n      {local:\"Em desenvolvimento\",desc:\"Evolui de forma consistente. Aplica a competência com autonomia crescente, aprende ativamente com feedbacks e experiências e contribui de maneira cada vez mais previsível no dia a dia.\",q:\"Eu já consigo executar sozinho no dia a dia, mas ainda travo ou erro em situações mais complexas?\"},\n      {local:\"Sólido\",desc:\"Demonstra domínio consistente da competência. Atua de forma estável, confiável e com qualidade contínua nas entregas. Requer pouca supervisão e mantém performance segura.\",q:\"Eu executo essa competência com autonomia e consistência, dentro do que meu cargo exige, sem precisar de supervisão constante?\"},\n      {local:\"Acima do esperado\",desc:\"Opera em um nível diferenciado de eficácia. Aplica a competência com profundidade, gera valor além do esperado e produz impacto claro no time, nos processos e nos resultados.\",q:\"Eu já lido bem com situações complexas ou inéditas nessa competência, superando o que normalmente se espera do meu nível?\"},\n      {local:\"Referência\",desc:\"É referência na competência. Demonstra excelência sustentada, influencia outros pelo exemplo e contribui ativamente para elevar padrões de atuação, desenvolvendo pessoas e fortalecendo a cultura.\",q:\"As pessoas me procuram como referência nessa competência, e eu já ajudo a desenvolver outros nesse tema?\"}\n    ]\n  },\n  s4: {\n    title: \"Como fazer a sua autoavaliação\",\n    p1: \"Autoavaliação é sobre evidência. A nota que você dá a si mesmo deve refletir o que você realmente entregou no período, com exemplos concretos que sustentem cada pontuação — não a sua impressão geral, o esforço percebido ou o quanto você acha que “deveria” estar indo bem.\",\n    p2: \"Uma autoavaliação inflada tira a credibilidade da conversa com o líder; uma autoavaliação rebaixada esconde conquistas reais e atrapalha o seu próprio desenvolvimento.\",\n    biasTitle: \"Os dois vieses mais comuns\",\n    fixL: \"Como evitar\",\n    biases: [\n      {t:\"Superestimação\",d:\"“Acho que fui bem, então dou nota alta” — sem nenhuma evidência concreta que sustente a pontuação.\",fix:\"Para cada nota, pergunte-se: “eu tenho pelo menos um exemplo real que comprova isso?” Se não tiver, revise a nota para baixo.\"},\n      {t:\"Subestimação\",d:\"Minimizar conquistas reais por síndrome do impostor, modéstia excessiva ou comparação com colegas mais experientes.\",fix:\"Liste 3 entregas concretas do período antes de pontuar, mesmo que pareça “óbvio” ou “pequeno” — muitas vezes já são evidência de Solid ou Outstanding.\"}\n    ],\n    stepsTitle: \"Passo a passo recomendado\",\n    stepsIntro: \"A autoavaliação é o seu ponto de partida no ciclo.\",\n    steps: [\n      {n:\"1\",t:\"Leia cada competência do seu cargo\",d:\"Abra o modelo da sua disciplina e leia com calma a descrição de cada competência que compõe a sua avaliação.\"},\n      {n:\"2\",t:\"Compare com os 5 níveis da escala\",d:\"Para cada competência, leia as descrições de Start a Role Model e identifique em qual nível a sua atuação se encaixa hoje.\"},\n      {n:\"3\",t:\"Use os sinais de presença e ausência\",d:\"Cada competência traz exemplos de comportamentos esperados e não esperados; use-os como referência objetiva, não a sua percepção geral.\"},\n      {n:\"4\",t:\"Registre exemplos reais\",d:\"Anote situações concretas do seu dia a dia que sustentam a nota escolhida; isso enriquece a conversa de consenso com o seu líder.\"}\n    ],\n    tipsTitle: \"Dicas para uma boa autoavaliação\",\n    tips: [\n      {t:\"Seja honesto, não modesto nem inflado\",d:\"A nota mais útil é a mais real: ela é o ponto de partida da conversa, não um veredito final.\"},\n      {t:\"Baseie-se em fatos, não em sensações\",d:\"Prefira “entreguei X no prazo Y” a “acho que fui bem esse ano”.\"},\n      {t:\"Avalie competência por competência\",d:\"Evite dar a mesma nota para tudo só porque o período foi bom (ou difícil) de forma geral.\"},\n      {t:\"Pense no período todo do ciclo\",d:\"Não deixe as últimas semanas pesarem mais do que os meses anteriores.\"}\n    ]\n  },\n  s5: {\n    title: \"O momento do consenso com o líder\",\n    p1: \"Depois da sua autoavaliação, o seu líder também avalia você, de forma independente, usando exatamente o mesmo modelo, a mesma escala e os mesmos pesos. O consenso é a conversa em que as duas visões se encontram.\",\n    p2: \"Nessa conversa, você e o seu líder vão:\",\n    items: [\"Comparar, competência por competência, a sua nota e a nota do líder.\",\"Entender o porquê de cada divergência, com exemplos concretos de parte a parte.\",\"Chegar a uma nota final combinada — uma decisão construída na conversa.\",\"Registrar os combinados que vão virar o plano de desenvolvimento (PDI).\"],\n    calloutT: \"Divergências são normais e esperadas.\",\n    calloutD: \"É justamente para isso que existe o consenso: alinhar percepção entre você e o seu líder, não “vencer” a conversa ou defender uma nota a qualquer custo.\",\n    afterTitle: \"O que fazer após o consenso\",\n    afterIntro: \"Você também tem responsabilidade sobre o que acontece a partir dali. A avaliação é só o ponto de partida — o que você faz com o resultado é o que determina se ele vira crescimento.\",\n    after: [\n      {n:\"1\",t:\"Releia sua avaliação com calma, sem reagir na hora\",d:\"É natural sentir desconforto diante de um ponto de desenvolvimento. Dê um tempo antes de concordar ou discordar — releia as evidências com atenção, não só o nível atribuído.\"},\n      {n:\"2\",t:\"Entenda o “porquê” por trás de cada nível\",d:\"Não fique só no “fui avaliado como Solid”. Volte à evidência e à descrição do próximo nível: essa diferença mostra o que muda no seu dia a dia.\"},\n      {n:\"3\",t:\"Leve dúvidas e discordâncias ao seu líder\",d:\"Se algo não fez sentido, converse — de preferência logo depois do fechamento, não meses depois. Silêncio não resolve divergência; conversa resolve.\"},\n      {n:\"4\",t:\"Construa o seu plano de desenvolvimento\",d:\"Pense em quais ações realmente ajudam você a evoluir na competência identificada.\"},\n      {n:\"5\",t:\"Transforme o plano em ações concretas\",d:\"Um plano não é uma lista de boas intenções. Se o ponto foi disciplina de CRM, por exemplo, é sobre efetivamente mudar a rotina — não lembrar que precisa mudar.\"},\n      {n:\"6\",t:\"Busque feedback antes do próximo ciclo\",d:\"Pergunte ao seu líder, nos 1:1s, como ele enxerga sua evolução no ponto combinado. Ajustar cedo é sempre mais fácil do que corrigir tarde.\"},\n      {n:\"7\",t:\"Reconheça seu próprio progresso\",d:\"Desenvolvimento raramente é linear. Reconhecer avanços — mesmo pequenos — ajuda a manter a motivação ao longo do processo.\"}\n    ],\n    summary: \"Em resumo: o consenso te mostra onde você está. O que você faz com essa informação nos meses seguintes é o que decide onde você vai estar no próximo ciclo.\"\n  },\n  s6: {\n    title: \"Perguntas frequentes\",\n    items: [\n      {q:\"A minha nota final é a média entre a minha autoavaliação e a do líder?\",a:\"Não. A nota final é construída na conversa de consenso — ela pode coincidir com uma média em alguns casos, mas o processo é sempre de discussão e alinhamento, não de cálculo automático.\"},\n      {q:\"A AVD influencia diretamente meu salário ou promoção?\",a:\"A AVD é um dos insumos usados nas discussões de carreira, reconhecimento e sucessão — mas não é o único critério, nem uma fórmula automática de aumento ou promoção.\"},\n      {q:\"Existe prazo para concluir minha autoavaliação?\",a:\"Sim, o ciclo tem data de início e fim. Faça sua avaliação o quanto antes para que o líder tenha tempo hábil de marcar o consenso, que deve ser realizado antes da data final.\"},\n      {q:\"É obrigatório realizar a avaliação de desempenho?\",a:\"Sim. É um processo obrigatório para os colaboradores e faz parte do seu desenvolvimento e crescimento na empresa.\"},\n      {q:\"O que preciso fazer pós-avaliação?\",a:\"O consenso não é o fim do ciclo, é o início do plano de ação. Converse com seu líder e monte um plano de desenvolvimento individual (PDI), focando nas competências que necessitam desenvolvimento.\"}\n    ]\n  },\n  s7: {\n    title: \"Passo a passo na Suite\",\n    sub: \"Como fazer a autoavaliação\",\n    pathL: \"Caminho\",\n    path: [\"Minhas Tarefas\",\"Competências\",\"Execução de Avaliação\",\"Autoavaliação\"],\n    cap1: \"Na Central de tarefas, filtre por Competência e Execução de avaliação e abra a sua Autoavaliação.\",\n    cap2: \"Para cada competência, selecione o nível de proficiência e justifique sua resposta.\",\n    after: \"Após a realização da sua autoavaliação, o líder agendará a conversa de consenso.\"\n  },\n  footer: \"Avaliação de Desempenho — Guia do Colaborador\",\n  toTop: \"Voltar ao topo\"\n},\nen: {\n  brandSub: \"Employee Guide · PMC\",\n  nav: [{id:\"about\",label:\"What it is\"},{id:\"model\",label:\"Model\"},{id:\"levels\",label:\"Proficiency\"},{id:\"self\",label:\"Self-assessment\"},{id:\"consensus\",label:\"Consensus\"},{id:\"faq\",label:\"FAQ\"},{id:\"suite\",label:\"In the Suite\"}],\n  heroEyebrow: \"Employee Guide\",\n  heroTitle: \"Performance Management Cycle\",\n  heroLead: \"Everything you need to know to take part in the Performance Management Cycle: how the model works, how to assess yourself and what to do after the consensus with your leader.\",\n  heroCta: \"Start reading\",\n  heroCta2: \"Go to the Suite\",\n  heroStats: [{n:\"8\",l:\"competencies assessed\"},{n:\"3\",l:\"stages in the cycle\"},{n:\"5\",l:\"proficiency levels\"}],\n  s1: {\n    title: \"What is the Performance Management Cycle\",\n    p1: \"The Performance Management Cycle is the structured moment when you and your leader look together at your work output and your behavior, using the same criteria for everyone in the same role.\",\n    p2: \"If this is your first Performance Management Cycle, the most important thing to understand before anything else is this:\",\n    quote: \"The Performance Management Cycle is not a test, nor a punishment.\",\n    p3: \"It is a development tool. It exists to recognize what you already do well, align expectations with your leader about what your role requires and build, together, the next steps of your career at SoftExpert.\",\n    cards: [\n      {t:\"Same criteria for everyone\",d:\"Roles are assessed with the same competency model, so everyone is measured by the same yardstick.\"},\n      {t:\"Two dimensions\",d:\"What you deliver (performance competencies) and how you deliver it (behavioral competencies).\"},\n      {t:\"A cycle, not a one-off event\",d:\"Self-assessment, consensus with your leader and follow-up afterwards — all three are part of the same process.\"}\n    ]\n  },\n  s2: {\n    title: \"How the model works\",\n    p1: \"The main goal is to ensure professionals are aligned with the expectations of their role and the organization's objectives, fostering individual development and continuous improvement of results.\",\n    p2: \"Today we use a model with 8 competencies in total — a common practice in talent management frameworks — divided into:\",\n    perfT: \"Performance\",\n    perfD: \"Technical and delivery competencies specific to your discipline: the “what” you produce day to day.\",\n    behT: \"Behavior\",\n    behD: \"Behavioral competencies: “how” you deliver, relate to others and collaborate with the team.\",\n    stagesTitle: \"Performance Management Cycle stages\",\n    stages: [{n:\"1\",t:\"Self-assessment\"},{n:\"2\",t:\"Leader assessment\"},{n:\"3\",t:\"Consensus\"}],\n    ruleL: \"Rule\",\n    rule: \"The Performance Management Cycle applies to employees with more than 3 months at the company.\"\n  },\n  s3: {\n    title: \"Proficiency levels\",\n    p: \"Proficiency levels describe how well a person masters a specific competency — from the early learning stage to full mastery, able to be a reference for others. Instead of a loose numeric score (subjective and varying between assessors), the model describes in words what observable behavior looks like at each stage.\",\n    askL: \"A question to help you place yourself\",\n    levels: [\n      {local:\"Beginning\",desc:\"In the early stages of developing the competency. Understands the fundamentals and performs basic activities with frequent support and guidance.\",q:\"Do I still need constant support to apply this competency, even in simple situations?\"},\n      {local:\"Developing\",desc:\"Evolves consistently. Applies the competency with growing autonomy, actively learns from feedback and experience, and contributes in an increasingly predictable way.\",q:\"Can I already handle it on my own day to day, but still get stuck or make mistakes in more complex situations?\"},\n      {local:\"Solid\",desc:\"Shows consistent mastery of the competency. Works in a stable, reliable way with continuous quality. Requires little supervision and maintains dependable performance.\",q:\"Do I apply this competency with autonomy and consistency, as my role requires, without constant supervision?\"},\n      {local:\"Above expectations\",desc:\"Operates at a distinctive level of effectiveness. Applies the competency in depth, generates value beyond expectations and has clear impact on the team, processes and results.\",q:\"Do I already handle complex or new situations well in this competency, exceeding what is normally expected of my level?\"},\n      {local:\"Benchmark\",desc:\"Is a reference in the competency. Shows sustained excellence, influences others by example and actively raises performance standards, developing people and strengthening the culture.\",q:\"Do people come to me as a reference in this competency, and do I already help develop others in it?\"}\n    ]\n  },\n  s4: {\n    title: \"How to do your self-assessment\",\n    p1: \"Self-assessment is about evidence. The score you give yourself should reflect what you actually delivered in the period, with concrete examples backing each rating — not your general impression, perceived effort or how well you think you “should” be doing.\",\n    p2: \"An inflated self-assessment undermines the credibility of the conversation with your leader; an underrated one hides real achievements and hinders your own development.\",\n    biasTitle: \"The two most common biases\",\n    fixL: \"How to avoid it\",\n    biases: [\n      {t:\"Overestimation\",d:\"“I think I did well, so I'll give myself a high score” — without any concrete evidence to support it.\",fix:\"For each score, ask yourself: “do I have at least one real example that proves this?” If not, lower the score.\"},\n      {t:\"Underestimation\",d:\"Downplaying real achievements due to impostor syndrome, excessive modesty or comparison with more experienced colleagues.\",fix:\"List 3 concrete deliverables from the period before scoring, even if they seem “obvious” or “small” — they are often already evidence of Solid or Outstanding.\"}\n    ],\n    stepsTitle: \"Recommended step by step\",\n    stepsIntro: \"The self-assessment is your starting point in the cycle.\",\n    steps: [\n      {n:\"1\",t:\"Read each competency of your role\",d:\"Open your discipline's model and calmly read the description of each competency in your Performance Management Cycle.\"},\n      {n:\"2\",t:\"Compare with the 5 levels of the scale\",d:\"For each competency, read the descriptions from Start to Role Model and identify which level fits your work today.\"},\n      {n:\"3\",t:\"Use the presence and absence signals\",d:\"Each competency includes examples of expected and unexpected behaviors; use them as an objective reference, not your general perception.\"},\n      {n:\"4\",t:\"Record real examples\",d:\"Write down concrete situations from your day to day that support the chosen score; this enriches the consensus conversation.\"}\n    ],\n    tipsTitle: \"Tips for a good self-assessment\",\n    tips: [\n      {t:\"Be honest — neither modest nor inflated\",d:\"The most useful score is the most real one: it is the starting point of the conversation, not a final verdict.\"},\n      {t:\"Rely on facts, not feelings\",d:\"Prefer “I delivered X by deadline Y” over “I think I did well this year”.\"},\n      {t:\"Assess competency by competency\",d:\"Avoid giving the same score to everything just because the period was generally good (or hard).\"},\n      {t:\"Consider the whole cycle\",d:\"Don't let the last few weeks weigh more than the previous months.\"}\n    ]\n  },\n  s5: {\n    title: \"The consensus with your leader\",\n    p1: \"After your self-assessment, your leader also assesses you independently, using exactly the same model, scale and weights. The consensus is the conversation where both views meet.\",\n    p2: \"In this conversation, you and your leader will:\",\n    items: [\"Compare, competency by competency, your score and your leader's.\",\"Understand the reason for each difference, with concrete examples from both sides.\",\"Reach an agreed final score — a decision built through conversation.\",\"Record the agreements that will become your Individual Development Plan (IDP).\"],\n    calloutT: \"Differences are normal and expected.\",\n    calloutD: \"That's exactly what the consensus is for: aligning perceptions between you and your leader, not “winning” the conversation or defending a score at all costs.\",\n    afterTitle: \"What to do after the consensus\",\n    afterIntro: \"You are also responsible for what happens next. The Performance Management Cycle is only the starting point — what you do with the result is what turns it into growth.\",\n    after: [\n      {n:\"1\",t:\"Reread your results calmly, without reacting right away\",d:\"It's natural to feel uneasy about a development point. Take time before agreeing or disagreeing — reread the evidence carefully, not just the level assigned.\"},\n      {n:\"2\",t:\"Understand the “why” behind each level\",d:\"Don't stop at “I was rated Solid”. Go back to the evidence and the description of the next level: that gap shows what changes in your daily work.\"},\n      {n:\"3\",t:\"Take questions and disagreements to your leader\",d:\"If something didn't make sense, talk about it — ideally right after closing, not months later. Silence doesn't resolve differences; conversation does.\"},\n      {n:\"4\",t:\"Build your development plan\",d:\"Think about which actions will really help you grow in the identified competency.\"},\n      {n:\"5\",t:\"Turn the plan into concrete daily actions\",d:\"A plan is not a list of good intentions. If the point was CRM discipline, for example, it's about actually changing your routine — not remembering you need to.\"},\n      {n:\"6\",t:\"Seek feedback before the next cycle\",d:\"Ask your leader in 1:1s how they see your progress on the agreed point. Adjusting early is always easier than correcting late.\"},\n      {n:\"7\",t:\"Recognize your own progress\",d:\"Development is rarely linear. Acknowledging progress — even small — helps keep you motivated throughout the process.\"}\n    ],\n    summary: \"In short: the consensus shows you where you are. What you do with that information in the following months decides where you'll be in the next cycle.\"\n  },\n  s6: {\n    title: \"Frequently asked questions\",\n    items: [\n      {q:\"Is my final score the average of my self-assessment and my leader's?\",a:\"No. The final score is built in the consensus conversation — it may match an average in some cases, but the process is always one of discussion and alignment, not automatic calculation.\"},\n      {q:\"Does the Performance Management Cycle directly affect my salary or promotion?\",a:\"The Performance Management Cycle is one of the inputs used in career, recognition and succession discussions — but it is not the only criterion, nor an automatic formula for raises or promotions.\"},\n      {q:\"Is there a deadline to complete my self-assessment?\",a:\"Yes, the cycle has a start and end date. Complete your assessment as early as possible so your leader has time to schedule the consensus, which must take place before the end date.\"},\n      {q:\"Is the Performance Management Cycle mandatory?\",a:\"Yes. It is a mandatory process for employees and part of your development and growth at the company.\"},\n      {q:\"What do I need to do after the Performance Management Cycle?\",a:\"The consensus is not the end of the cycle; it's the start of the action plan. Talk to your leader and build an Individual Development Plan (IDP), focusing on the competencies that need development.\"}\n    ]\n  },\n  s7: {\n    title: \"Step by step in the Suite\",\n    sub: \"How to do your self-assessment\",\n    pathL: \"Path\",\n    path: [\"My Tasks\",\"Competencies\",\"Performance Management Cycle Execution\",\"Self-assessment\"],\n    cap1: \"In the Task center, filter by Competency and Performance Management Cycle execution, then open your Self-assessment.\",\n    cap2: \"For each competency, select the proficiency level and justify your answer.\",\n    after: \"Once you complete your self-assessment, your leader will schedule the consensus conversation.\"\n  },\n  footer: \"Performance Management Cycle — Employee Guide\",\n  toTop: \"Back to top\"\n},\nes: {\n  brandSub: \"Guía del Colaborador · ED\",\n  nav: [{id:\"about\",label:\"Qué es\"},{id:\"model\",label:\"Modelo\"},{id:\"levels\",label:\"Competencia\"},{id:\"self\",label:\"Autoevaluación\"},{id:\"consensus\",label:\"Consenso\"},{id:\"faq\",label:\"Preguntas\"},{id:\"suite\",label:\"En la Suite\"}],\n  heroEyebrow: \"Guía del Colaborador\",\n  heroTitle: \"Evaluación de Desempeño\",\n  heroLead: \"Todo lo que necesitas saber para participar en el ciclo de evaluación: cómo funciona el modelo, cómo autoevaluarte y qué hacer después del consenso con tu líder.\",\n  heroCta: \"Empezar la lectura\",\n  heroCta2: \"Ir a la Suite\",\n  heroStats: [{n:\"8\",l:\"competencias evaluadas\"},{n:\"3\",l:\"etapas en el ciclo\"},{n:\"5\",l:\"niveles de dominio\"}],\n  s1: {\n    title: \"Qué es la Evaluación de Desempeño\",\n    p1: \"La Evaluación de Desempeño es el momento estructurado en el que tú y tu líder analizan juntos tus entregas y tu comportamiento en el trabajo, con los mismos criterios para todas las personas del mismo cargo.\",\n    p2: \"Si es la primera vez que participas en un ciclo de evaluación, lo más importante que debes entender antes que nada es esto:\",\n    quote: \"La evaluación no es un examen ni un castigo.\",\n    p3: \"Es una herramienta de desarrollo. Existe para reconocer lo que ya haces bien, alinear expectativas con tu líder sobre lo que se espera de tu cargo y construir, juntos, los próximos pasos de tu carrera en SoftExpert.\",\n    cards: [\n      {t:\"El mismo criterio para todos\",d:\"Los cargos se evalúan con el mismo modelo de competencias, así que todos se miden con la misma vara.\"},\n      {t:\"Dos dimensiones\",d:\"Lo que entregas (competencias de desempeño) y cómo lo entregas (competencias conductuales).\"},\n      {t:\"Un ciclo, no un evento aislado\",d:\"Autoevaluación, consenso con el líder y seguimiento posterior: los tres forman parte del mismo proceso.\"}\n    ]\n  },\n  s2: {\n    title: \"Cómo funciona el modelo\",\n    p1: \"El objetivo principal es garantizar que los profesionales estén alineados con las expectativas del cargo y los objetivos de la organización, promoviendo el desarrollo individual y la mejora continua de los resultados.\",\n    p2: \"Hoy utilizamos un modelo con un total de 8 competencias — práctica común en los marcos de gestión del talento — divididas en:\",\n    perfT: \"Desempeño\",\n    perfD: \"Competencias técnicas y de entrega, específicas de tu disciplina: el “qué” produces en tu día a día.\",\n    behT: \"Comportamiento\",\n    behD: \"Competencias conductuales: el “cómo” entregas, te relacionas y colaboras con el equipo.\",\n    stagesTitle: \"Etapas de la evaluación\",\n    stages: [{n:\"1\",t:\"Autoevaluación\"},{n:\"2\",t:\"Evaluación del líder\"},{n:\"3\",t:\"Consenso\"}],\n    ruleL: \"Regla\",\n    rule: \"La Evaluación de Desempeño se realiza para colaboradores con más de 3 meses en la empresa.\"\n  },\n  s3: {\n    title: \"Niveles de dominio\",\n    p: \"Los niveles de dominio describen qué tan bien una persona domina una competencia específica — desde la etapa inicial de aprendizaje hasta el dominio completo, capaz de ser referencia para otros. En lugar de una nota numérica aislada (subjetiva y variable entre evaluadores), el modelo describe con palabras cómo es el comportamiento observable en cada etapa.\",\n    askL: \"Pregunta que te ayuda a ubicarte\",\n    levels: [\n      {local:\"Inicio\",desc:\"Está en las primeras etapas de desarrollo de la competencia. Comprende los fundamentos y realiza actividades básicas con apoyo y orientación frecuentes.\",q:\"¿Todavía necesito apoyo constante para aplicar esta competencia, incluso en situaciones simples?\"},\n      {local:\"En desarrollo\",desc:\"Evoluciona de forma consistente. Aplica la competencia con autonomía creciente, aprende activamente de la retroalimentación y la experiencia, y contribuye de forma cada vez más previsible.\",q:\"¿Ya puedo hacerlo solo en el día a día, pero todavía me trabo o me equivoco en situaciones más complejas?\"},\n      {local:\"Sólido\",desc:\"Demuestra dominio consistente de la competencia. Actúa de forma estable, confiable y con calidad continua. Requiere poca supervisión y mantiene un desempeño seguro.\",q:\"¿Aplico esta competencia con autonomía y consistencia, según lo que exige mi cargo, sin supervisión constante?\"},\n      {local:\"Por encima de lo esperado\",desc:\"Opera en un nivel diferenciado de eficacia. Aplica la competencia con profundidad, genera valor más allá de lo esperado y produce un impacto claro en el equipo, los procesos y los resultados.\",q:\"¿Ya manejo bien situaciones complejas o inéditas en esta competencia, superando lo que normalmente se espera de mi nivel?\"},\n      {local:\"Referente\",desc:\"Es referente en la competencia. Demuestra excelencia sostenida, influye en otros con el ejemplo y contribuye activamente a elevar los estándares, desarrollando personas y fortaleciendo la cultura.\",q:\"¿Las personas me buscan como referente en esta competencia, y ya ayudo a desarrollar a otros en este tema?\"}\n    ]\n  },\n  s4: {\n    title: \"Cómo hacer tu autoevaluación\",\n    p1: \"La autoevaluación se basa en evidencias. La nota que te das debe reflejar lo que realmente entregaste en el período, con ejemplos concretos que respalden cada puntuación — no tu impresión general, el esfuerzo percibido ni cuánto crees que “deberías” estar rindiendo.\",\n    p2: \"Una autoevaluación inflada le resta credibilidad a la conversación con tu líder; una autoevaluación rebajada oculta logros reales y perjudica tu propio desarrollo.\",\n    biasTitle: \"Los dos sesgos más comunes\",\n    fixL: \"Cómo evitarlo\",\n    biases: [\n      {t:\"Sobreestimación\",d:\"“Creo que me fue bien, así que me pongo una nota alta” — sin ninguna evidencia concreta que respalde la puntuación.\",fix:\"Para cada nota, pregúntate: “¿tengo al menos un ejemplo real que lo demuestre?” Si no lo tienes, baja la nota.\"},\n      {t:\"Subestimación\",d:\"Minimizar logros reales por síndrome del impostor, modestia excesiva o comparación con colegas más experimentados.\",fix:\"Enumera 3 entregas concretas del período antes de puntuar, aunque parezcan “obvias” o “pequeñas” — muchas veces ya son evidencia de Solid u Outstanding.\"}\n    ],\n    stepsTitle: \"Paso a paso recomendado\",\n    stepsIntro: \"La autoevaluación es tu punto de partida en el ciclo.\",\n    steps: [\n      {n:\"1\",t:\"Lee cada competencia de tu cargo\",d:\"Abre el modelo de tu disciplina y lee con calma la descripción de cada competencia que compone tu evaluación.\"},\n      {n:\"2\",t:\"Compara con los 5 niveles de la escala\",d:\"Para cada competencia, lee las descripciones de Start a Role Model e identifica en qué nivel encaja tu actuación hoy.\"},\n      {n:\"3\",t:\"Usa las señales de presencia y ausencia\",d:\"Cada competencia incluye ejemplos de comportamientos esperados y no esperados; úsalos como referencia objetiva, no tu percepción general.\"},\n      {n:\"4\",t:\"Registra ejemplos reales\",d:\"Anota situaciones concretas de tu día a día que respalden la nota elegida; esto enriquece la conversación de consenso con tu líder.\"}\n    ],\n    tipsTitle: \"Consejos para una buena autoevaluación\",\n    tips: [\n      {t:\"Sé honesto, ni modesto ni inflado\",d:\"La nota más útil es la más real: es el punto de partida de la conversación, no un veredicto final.\"},\n      {t:\"Básate en hechos, no en sensaciones\",d:\"Prefiere “entregué X en el plazo Y” a “creo que me fue bien este año”.\"},\n      {t:\"Evalúa competencia por competencia\",d:\"Evita poner la misma nota a todo solo porque el período fue bueno (o difícil) en general.\"},\n      {t:\"Piensa en todo el ciclo\",d:\"No dejes que las últimas semanas pesen más que los meses anteriores.\"}\n    ]\n  },\n  s5: {\n    title: \"El momento del consenso con el líder\",\n    p1: \"Después de tu autoevaluación, tu líder también te evalúa de forma independiente, con exactamente el mismo modelo, la misma escala y los mismos pesos. El consenso es la conversación en la que ambas visiones se encuentran.\",\n    p2: \"En esta conversación, tú y tu líder van a:\",\n    items: [\"Comparar, competencia por competencia, tu nota y la del líder.\",\"Entender el porqué de cada diferencia, con ejemplos concretos de ambas partes.\",\"Llegar a una nota final acordada — una decisión construida en la conversación.\",\"Registrar los acuerdos que se convertirán en tu Plan de Desarrollo Individual (PDI).\"],\n    calloutT: \"Las diferencias son normales y esperadas.\",\n    calloutD: \"Para eso existe el consenso: alinear percepciones entre tú y tu líder, no “ganar” la conversación ni defender una nota a cualquier costo.\",\n    afterTitle: \"Qué hacer después del consenso\",\n    afterIntro: \"Tú también eres responsable de lo que sucede a partir de ahí. La evaluación es solo el punto de partida — lo que haces con el resultado es lo que determina si se convierte en crecimiento.\",\n    after: [\n      {n:\"1\",t:\"Relee tu evaluación con calma, sin reaccionar de inmediato\",d:\"Es natural sentir incomodidad ante un punto de desarrollo. Tómate un tiempo antes de estar de acuerdo o no — relee las evidencias con atención, no solo el nivel asignado.\"},\n      {n:\"2\",t:\"Entiende el “porqué” detrás de cada nivel\",d:\"No te quedes en “me evaluaron como Solid”. Vuelve a la evidencia y a la descripción del siguiente nivel: esa diferencia muestra qué cambia en tu día a día.\"},\n      {n:\"3\",t:\"Lleva tus dudas y desacuerdos a tu líder\",d:\"Si algo no tuvo sentido, conversa — preferiblemente justo después del cierre, no meses después. El silencio no resuelve diferencias; la conversación sí.\"},\n      {n:\"4\",t:\"Construye tu plan de desarrollo\",d:\"Piensa en qué acciones realmente te ayudan a evolucionar en la competencia identificada.\"},\n      {n:\"5\",t:\"Convierte el plan en acciones concretas\",d:\"Un plan no es una lista de buenas intenciones. Si el punto fue la disciplina con el CRM, por ejemplo, se trata de cambiar de verdad la rutina — no de recordar que hay que cambiarla.\"},\n      {n:\"6\",t:\"Busca retroalimentación antes del próximo ciclo\",d:\"Pregunta a tu líder, en los 1:1, cómo ve tu evolución en el punto acordado. Ajustar temprano siempre es más fácil que corregir tarde.\"},\n      {n:\"7\",t:\"Reconoce tu propio progreso\",d:\"El desarrollo rara vez es lineal. Reconocer los avances — aunque sean pequeños — ayuda a mantener la motivación a lo largo del proceso.\"}\n    ],\n    summary: \"En resumen: el consenso te muestra dónde estás. Lo que hagas con esa información en los meses siguientes decide dónde estarás en el próximo ciclo.\"\n  },\n  s6: {\n    title: \"Preguntas frecuentes\",\n    items: [\n      {q:\"¿Mi nota final es el promedio entre mi autoevaluación y la del líder?\",a:\"No. La nota final se construye en la conversación de consenso — puede coincidir con un promedio en algunos casos, pero el proceso siempre es de discusión y alineación, no de cálculo automático.\"},\n      {q:\"¿La evaluación influye directamente en mi salario o ascenso?\",a:\"La evaluación es uno de los insumos usados en las discusiones de carrera, reconocimiento y sucesión — pero no es el único criterio ni una fórmula automática de aumento o ascenso.\"},\n      {q:\"¿Hay plazo para completar mi autoevaluación?\",a:\"Sí, el ciclo tiene fecha de inicio y fin. Haz tu evaluación cuanto antes para que el líder tenga tiempo de agendar el consenso, que debe realizarse antes de la fecha final.\"},\n      {q:\"¿Es obligatorio realizar la evaluación de desempeño?\",a:\"Sí. Es un proceso obligatorio para los colaboradores y forma parte de tu desarrollo y crecimiento en la empresa.\"},\n      {q:\"¿Qué debo hacer después de la evaluación?\",a:\"El consenso no es el fin del ciclo, es el inicio del plan de acción. Conversa con tu líder y arma un Plan de Desarrollo Individual (PDI), enfocado en las competencias que necesitan desarrollo.\"}\n    ]\n  },\n  s7: {\n    title: \"Paso a paso en la Suite\",\n    sub: \"Cómo hacer la autoevaluación\",\n    pathL: \"Ruta\",\n    path: [\"Mis Tareas\",\"Competencias\",\"Ejecución de Evaluación\",\"Autoevaluación\"],\n    cap1: \"En la Central de tareas, filtra por Competencia y Ejecución de evaluación y abre tu Autoevaluación.\",\n    cap2: \"Para cada competencia, selecciona el nivel de dominio y justifica tu respuesta.\",\n    after: \"Después de completar tu autoevaluación, el líder agendará la conversación de consenso.\"\n  },\n  footer: \"Evaluación de Desempeño — Guía del Colaborador\",\n  toTop: \"Volver arriba\"\n}\n};\n\nclass Component extends DCLogic {\n  state = { lang: null, open: {} };\n  componentDidMount() {\n    let saved = null;\n    try { saved = localStorage.getItem('avd-lang'); } catch (e) {}\n    if (!saved) {\n      const nav = (navigator.language || '').slice(0, 2);\n      saved = T[nav] ? nav : null;\n    }\n    if (saved && T[saved]) this.setState({ lang: saved });\n  }\n  setLang(code) {\n    try { localStorage.setItem('avd-lang', code); } catch (e) {}\n    document.documentElement.lang = code === 'pt' ? 'pt-BR' : code;\n    this.setState({ lang: code });\n  }\n  renderVals() {\n    const lang = this.state.lang || this.props.defaultLang || 'pt';\n    const t = T[lang];\n    const expandAll = !!this.props.faqExpanded;\n    return {\n      t,\n      langs: ['pt', 'en', 'es'].map(c => ({\n        code: c.toUpperCase(),\n        active: c === lang,\n        bg: c === lang ? '#0B2A7A' : 'transparent',\n        fg: c === lang ? '#FFFFFF' : '#535B73',\n        select: () => this.setLang(c)\n      })),\n      levels: t.s3.levels.map((l, i) => ({ ...l, en: LEVEL_EN[i], score: SCORES[i], pct: SCORES[i] + '%' })),\n      faq: t.s6.items.map((f, i) => {\n        const open = this.state.open[i] ?? expandAll;\n        return { ...f, open, sign: open ? '−' : '+', toggle: () => this.setState(s => ({ open: { ...s.open, [i]: !open } })) };\n      }),\n      path: t.s7.path.map((label, i, a) => ({ label, arrow: i < a.length - 1 }))\n    };\n  }\n}\n<\u002Fscript>\n\n\n<div id=\"__claude_design_branding\"><style>#__claude_design_branding{p
